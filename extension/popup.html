<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>unfetch 设置</title>
<style>
  :root {
    --bg: #070710;
    --card: #14141f;
    --border: #2a2a3a;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --primary: #6366f1;
    --success: #10b981;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
  }
  header h1 { font-size: 14px; margin: 0; }
  header .status {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
  }
  header .dot.ok { background: var(--success); }
  header .dot.bad { background: var(--error); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row label { font-weight: 500; }
  .row .desc { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* iOS-style switch */
  .switch {
    position: relative;
    width: 38px;
    height: 22px;
    background: #444;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .switch.on { background: var(--success); }
  .switch::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: white;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .switch.on::after { transform: translateX(16px); }

  input[type="number"], input[type="text"] {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px;
    width: 90px;
  }

  textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    min-height: 50px;
    resize: vertical;
    font-family: inherit;
  }

  footer {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
  <header>
    <div class="logo">U</div>
    <h1>unfetch 下载助手</h1>
    <span class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">检查中…</span>
    </span>
  </header>

  <div class="row">
    <div>
      <label>启用接管</label>
      <div class="desc">关闭后所有下载走浏览器原生</div>
    </div>
    <div class="switch" id="enabledSwitch"></div>
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch; gap: 6px;">
    <label>最小文件大小（字节）</label>
    <input type="number" id="minSize" min="0" step="1024" />
    <div class="desc">小于这个值的文件让浏览器原生下载（0 = 不限）</div>
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch; gap: 6px;">
    <label>忽略后缀（逗号分隔）</label>
    <input type="text" id="ignoreExt" />
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch; gap: 6px;">
    <label>白名单域名（逗号分隔）</label>
    <textarea id="ignoreDomains" placeholder="example.com, intranet.local"></textarea>
  </div>

  <footer>
    daemon 监听 <a href="http://127.0.0.1:19543/health" target="_blank">127.0.0.1:19543</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
